services:
  growthera-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: growthera-mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - growthera_mssql_data:/var/opt/mssql

volumes:
  growthera_mssql_data: